<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Settings</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
        font-size: 2.4rem;
      }

      .setting-group {
        margin-bottom: 25px;
      }

      label {
        display: block;
        color: #555;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 1.4rem;
      }

      select,
      input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 1.6rem;
        transition: border-color 0.3s;
      }

      select:focus,
      input:focus {
        outline: none;
        border-color: #667eea;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .checkbox-group input[type='checkbox'] {
        width: auto;
        width: 24px;
        height: 24px;
        cursor: pointer;
      }

      .checkbox-group label {
        margin: 0;
        cursor: pointer;
      }

      button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.8rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      .status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        text-align: center;
        display: none;
      }

      .status.success {
        display: block;
        background: #d4edda;
        color: #155724;
      }

      .description {
        color: #888;
        font-size: 1.2rem;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⚙️ Dashboard Settings</h1>

      <form id="settingsForm">
        <div class="setting-group">
          <label for="cryptoCurrency">💰 Cryptocurrency</label>
          <select id="cryptoCurrency">
            <option value="bitcoin">Bitcoin (BTC)</option>
            <option value="ethereum">Ethereum (ETH)</option>
            <option value="dogecoin" selected>Dogecoin (DOGE)</option>
            <option value="cardano">Cardano (ADA)</option>
            <option value="solana">Solana (SOL)</option>
            <option value="polkadot">Polkadot (DOT)</option>
          </select>
          <div class="description">Select which crypto to display</div>
        </div>

        <div class="setting-group">
          <label for="temperatureUnit">🌡️ Temperature Unit</label>
          <select id="temperatureUnit">
            <option value="metric">Celsius (°C)</option>
            <option value="imperial">Fahrenheit (°F)</option>
          </select>
          <div class="description">Choose your preferred temperature unit</div>
        </div>

        <div class="setting-group">
          <label for="backgroundCategory">🖼️ Background Category</label>
          <select id="backgroundCategory">
            <option value="nature">Nature</option>
            <option value="city">City</option>
            <option value="ocean">Ocean</option>
            <option value="mountains">Mountains</option>
            <option value="forest">Forest</option>
          </select>
          <div class="description">What type of background do you prefer?</div>
        </div>

        <div class="setting-group">
          <div class="checkbox-group">
            <input type="checkbox" id="showCrypto" checked />
            <label for="showCrypto">Show Cryptocurrency</label>
          </div>
        </div>

        <div class="setting-group">
          <div class="checkbox-group">
            <input type="checkbox" id="showWeather" checked />
            <label for="showWeather">Show Weather</label>
          </div>
        </div>

        <button type="submit">💾 Save Settings</button>
      </form>

      <div id="status" class="status"></div>
    </div>

    <script src="options.js"></script>
  </body>
</html>
